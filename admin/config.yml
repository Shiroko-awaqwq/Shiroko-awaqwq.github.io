          - { label: "更新日期", name: "updated", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", required: false }
          - { label: "开启评论", name: "comments", widget: "boolean", default: true }
          - { label: "显示侧边栏", name: "aside", widget: "boolean", default: true }
          - { label: "开启 Aplayer", name: "aplayer", widget: "boolean", default: false, required: false }
          - { label: "页面类型 (type)", name: "type", widget: "string", required: false, hint: "Butterfly 特殊页面需填，如 link, about, tags 等" }
          - { label: "页面描述", name: "description", widget: "text", required: false }
          - { label: "关键字", name: "keywords", widget: "string", required: false }
          - { label: "顶部图片 (top_img)", name: "top_img", widget: "image", required: false }
          - { label: "显示目录 (TOC)", name: "toc", widget: "boolean", default: false, required: false }
          - { label: "显示目录编号", name: "toc_number", widget: "boolean", default: false, required: false }
          - { label: "目录简易样式", name: "toc_style_simple", widget: "boolean", default: false, required: false }
          - { label: "隐藏页面", name: "hidden", widget: "boolean", default: false, required: false, hint: "开启时不出现在sitemap/feed/search中" }
          - { label: "页面密码", name: "password", widget: "string", required: false, hint: "设置后启用加密保护" }
          - { label: "私密页面", name: "private", widget: "boolean", default: false, required: false, hint: "开启时完全隐藏（不生成文件）" }
          - { label: "正文内容", name: "body", widget: "markdown", required: false }
      - label: "标签页"
        name: "tags_page"
        file: "source/tags/index.md"
        fields:
